[package]
name = "huxdb"
version = "0.1.0"
description = "A database management editor"
authors = ["Jeff Carley <jeff.carley@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "huxdb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
futures-util = { version = "0.3", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
resvg = { version = "=0.47.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
usvg = { version = "=0.47.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
krilla = { version = "=0.8.2", default-features = false, features = ["simple-text"] }
krilla-svg = { version = "=0.8.1", default-features = false }
png = "0.18"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
